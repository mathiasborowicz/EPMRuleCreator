name: Windows standalone build

on:
  push:
    branches:
      - work
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_required: ${{ steps.changes.outputs.release_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release-relevant changes
        id: changes
        env:
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-change-filter.cjs

      - name: Resolve application and release version
        id: version
        run: node scripts/resolve-release-version.cjs

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate Explorer and update script syntax in Windows PowerShell
        shell: powershell
        run: |
          foreach ($explorerScript in Get-ChildItem .\scripts\*.ps1) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($explorerScript.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Test verified update unblocking in Windows PowerShell
        shell: powershell
        run: .\scripts\Test-UpdateUnblock.ps1

      - name: Run tests
        run: dotnet test .\EPMRuleCreator.sln --configuration Release

      - name: Test file field layout in Windows WPF
        shell: powershell
        run: .\scripts\Test-TextBoxLayout.ps1

      - name: Test release publishing with mocked GitHub API
        run: node --test tests/workflows/release-workflow.test.cjs tests/workflows/release-change-filter.test.cjs

      - name: Publish standalone Windows x64 app
        run: >-
          dotnet publish .\src\EPMRuleCreator.UI\EPMRuleCreator.UI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          --output .\publish\win-x64

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: EPMRuleCreator-win-x64
          path: publish/win-x64/EPMRuleCreator.exe
          if-no-files-found: error
          retention-days: 30

      - name: Validate committed MSI package
        shell: bash
        run: test -s releases/EPMRuleCreator-win-x64.msi

      - name: Upload license for release publication
        uses: actions/upload-artifact@v4
        with:
          name: EPMRuleCreator-license
          path: LICENSE
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Windows release assets
    needs: test-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-and-publish.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download tested executable
        uses: actions/download-artifact@v4
        with:
          name: EPMRuleCreator-win-x64
          path: release

      - name: Download GPL license
        uses: actions/download-artifact@v4
        with:
          name: EPMRuleCreator-license
          path: release

      - name: Use committed MSI
        shell: bash
        run: cp releases/EPMRuleCreator-win-x64.msi release/EPMRuleCreator-win-x64.msi

      - name: Package standalone EXE and license
        working-directory: release
        run: zip -9 EPMRuleCreator-win-x64.zip EPMRuleCreator.exe LICENSE

      - name: Create release and upload Windows packages
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.test-and-publish.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const version = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version || '')) throw new Error('Missing or invalid release version');
            const tag = `v${version}`;
            const assetName = 'EPMRuleCreator-win-x64.zip';
            // Read the complete asset before creating a public release.
            const data = fs.readFileSync(`release/${assetName}`);
            const msiName = 'EPMRuleCreator-win-x64.msi';
            const msiData = fs.readFileSync(`release/${msiName}`);
            const licenseData = fs.readFileSync('release/LICENSE');
            // List also includes drafts, allowing retries after a failed asset upload.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `EPMRuleCreator v${version}`,
                body: `Download EPMRuleCreator-win-x64.zip for the portable version, or EPMRuleCreator-win-x64.msi for the Windows Installer installation with its scope selection. The ZIP contains the standalone Windows x64 EXE and LICENSE; no .NET installation or compilation required. Security checks can still apply when extracting or running the app.\n\nLicense: GNU GPLv3. License text and corresponding source code are available in this release's tagged source: https://github.com/${owner}/${repo}/tree/${tag}`,
                generate_release_notes: true,
                draft: true,
                prerelease: false
              }));
            }
            // Re-running the same successful workflow must not create duplicates.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            for (const attachment of [
              { name: assetName, data, contentType: 'application/zip' },
              { name: msiName, data: msiData, contentType: 'application/x-msi' },
              { name: 'LICENSE', data: licenseData, contentType: 'text/plain' }
            ]) {
              if (assets.some(asset => asset.name === attachment.name)) {
                core.info(`Release already contains ${attachment.name}; preserving the published asset.`);
              } else {
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo,
                  release_id: release.id,
                  name: attachment.name,
                  data: attachment.data,
                  headers: { 'content-type': attachment.contentType }
                });
              }
            }
            // Publish only once the ZIP is attached; failed uploads stay drafts.
            if (release.draft) {
              ({ data: release } = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, draft: false, make_latest: 'true'
              }));
            }
            await core.summary.addHeading('Windows release')
              .addLink('Download EPMRuleCreator-win-x64.zip', `${release.html_url.replace('/tag/', '/download/')}/${assetName}`)
              .addLink('Download EPMRuleCreator-win-x64.msi', `${release.html_url.replace('/tag/', '/download/')}/${msiName}`)
              .write();
