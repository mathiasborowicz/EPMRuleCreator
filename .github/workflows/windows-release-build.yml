name: Windows standalone build

on:
  push:
    branches:
      - work
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate Explorer script syntax in Windows PowerShell
        shell: powershell
        run: |
          foreach ($explorerScript in Get-ChildItem .\scripts\*.ps1) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($explorerScript.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Run tests
        run: dotnet test .\IntuneEpmRuleCreator.sln --configuration Release

      - name: Publish standalone Windows x64 app
        run: >-
          dotnet publish .\src\IntuneEpmRuleCreator.UI\IntuneEpmRuleCreator.UI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          --output .\publish\win-x64

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: IntuneEpmRuleCreator-win-x64
          path: publish/win-x64/IntuneEpmRuleCreator.exe
          if-no-files-found: error
          retention-days: 30
